# Starter config for repo-metrics.
#
# Copy this next to your database and edit the paths. It will not load as-is:
# every repo path is checked at load time and has to be a directory that exists,
# so the placeholders below are a shape to copy, not a config to run.
#
# Every field has a default. The comments say what each one does and what
# happens if you leave it out.

# Where the SQLite database lives. Relative paths resolve against the working
# directory of whoever runs the tool, which matters if you schedule it, so
# prefer an absolute path once it is not just you running it by hand.
# Default: ./repo-metrics.db
database: /srv/repo-metrics/repo-metrics.db

# Default reporting window. Head is the newest usable snapshot, baseline is the
# newest usable snapshot at or before head minus this window.
#
# Every duration in this file reads the same as the ones on the flags: Go's
# duration syntax plus w for weeks and d for days, so 7d, 168h and 1w are the
# same week. Larger units come first, so 1w3d12h works and 3d1w is an error.
# Same for timeout and max_age further down.
# Default: 7d. Override per run with `report --window`.
window: 7d

# Noise floor for culprit ranking, in statements. A package smaller than this is
# left out of the "which package is why" list, because a three-statement helper
# going from 0 to 100 percent is not news. There is no appendix listing what got
# dropped: a small package that merely moved is not named in the report at all.
# Its statements do still count toward its repo's coverage number, and it is
# still listed by name if it was added or deleted.
# Default: 20
min_statements: 20

# How far a repo's coverage has to move, in percentage points, before it earns a
# spot in the movers section. Set this to 0 to see every twitch.
# Default: 0.5
min_repo_delta: 0.5

repos:
  - name: my-service
    # Absolute path to the checkout. Has to exist and be a directory or the
    # config fails to load. Required.
    path: /srv/checkouts/my-service

    # Extra environment variables for every signal below, added to the
    # environment repo-metrics itself is running with rather than replacing it.
    # Leave it out and the commands just inherit what repo-metrics has.
    #
    # This is here because command is an argv slice with no shell in front of
    # it, so there is nowhere to write a `VAR=x` prefix. The worked example is
    # the real one: a module sitting under a go.work that does not list it fails
    # every go command outright, and the fix is one variable.
    #
    # It sits at the repo level rather than only on each signal because it is
    # also the environment the toolchain fingerprint is taken under, and that
    # fingerprint is what tells the report whether two snapshots are comparable
    # at all. A signal can add its own on top; see the lint signal below.
    #
    # Keys are used exactly as written: no ${VAR} expansion, no empty key, and
    # no "=" inside a key, since the pair is joined as KEY=VALUE and a key
    # carrying its own "=" would set a different variable than the one you
    # wrote. Values do expand ${VAR} from the environment.
    env:
      GOWORK: "off"

    # What to measure. One entry per thing, and a repo needs at least one or
    # there is nothing to collect.
    #
    # A signal is the unit of execution and of failure: one going wrong costs
    # its own numbers and nothing else, and the snapshot comes back partial
    # rather than failed. One entry can feed two parsers, which is why the
    # coverage entry below names both an artifact_format and a stdout_format:
    # `go test` yields the profile and the test counts from a single run, and
    # running it twice to get them separately would be silly.
    signals:
      - # Names this step in diagnostics and in the progress line. Required, and
        # unique within the repo. Name the thing rather than the tool, since
        # this is what someone reads when it breaks.
        name: coverage

        # An argv slice, never a shell string. Nothing here goes through a
        # shell, so quoting and word splitting cannot surprise you, and it also
        # means you cannot use pipes or && here. Leave it out for ingest mode,
        # as in the second repo below.
        #
        # -coverpkg=./... matters: without it, packages that have no test files
        # are invisible in the profile and the repo percentage silently reads
        # high.
        command:
          - go
          - test
          - ./...
          - -json
          - -coverpkg=./...
          - -coverprofile=coverage.out

        # A file the command produces, relative to path unless absolute, and how
        # to read it. The two go together: an artifact with no format would be
        # checked for freshness and then never read, and a format with no
        # artifact has nothing to point at.
        #
        # In command mode this is also the freshness check. The file has to
        # change during the run, because "the command exited 0" is not evidence
        # that anything was produced: a .PHONY make target with no rule exits 0
        # having done nothing, and a stale profile at this path would otherwise
        # be reported as today's number forever.
        artifact: coverage.out
        artifact_format: go-coverprofile

        # Parse the command's stdout too, for test counts, pass/fail/skip, and
        # per-package durations. Leave it out and stdout is ignored, so you get
        # coverage but no test counts. Setting it without a command is an error,
        # since there would be no stdout to capture.
        stdout_format: go-test-json

        # Wall-clock budget for this signal's command. It is per signal rather
        # than per repo, so adding a second measurement does not silently halve
        # the time the first one gets. The command is killed when it expires and
        # the signal is recorded as failed rather than silently skipped.
        # Default: 10m
        timeout: 15m

      - # Lint findings, read as SARIF rather than as any one linter's native
        # output. golangci-lint, eslint, ruff, semgrep, clippy and CodeQL all
        # emit it, so this entry is the same shape whatever the repo is written
        # in. It is also the one format two signals in a repo may share, for
        # exactly that reason: a polyglot repo runs two linters and the findings
        # sum rather than collide.
        name: lint

        # The two max-issues flags are not optional if you want a measurement.
        # golangci-lint caps output at 50 issues per linter and 3 per repeated
        # message by DEFAULT, so without them the tracked number is a cap and a
        # repo that doubles its findings can chart as flat. Measured on a real
        # repo: 623 findings capped, 2760 uncapped, from the same run.
        command:
          - golangci-lint
          - run
          - --output.sarif.path
          - stdout
          - --max-issues-per-linter
          - "0"
          - --max-same-issues
          - "0"
        stdout_format: sarif

        # A signal's env merges over the repo's rather than replacing it, so
        # this entry still gets GOWORK=off from above.
        env:
          GOGC: "50"

        timeout: 5m

        # No artifact and no timeout worry about the exit code: golangci-lint
        # exits 1 whenever it finds anything, and so do eslint, ruff and clippy.
        # That is the tool reporting findings rather than reporting failure, and
        # repo-metrics knows the difference from the format rather than from a
        # setting here. A `go test` command exiting non-zero is treated as the
        # red suite it is.

      - # Dependency staleness. Three measurements come out of this one stream
        # and they are recorded independently, because they are knowable under
        # different conditions:
        #
        #   dependencies           the size of the build list. Needs nothing.
        #   dependency_age         median age of the pinned versions. Needs each
        #                          module to carry a publish timestamp, which
        #                          the toolchain reports with no network at all.
        #   outdated_dependencies  direct dependencies with a newer version.
        #                          Needs the module proxy to have been consulted.
        #
        # The -u is what makes the toolchain look for updates, and repo-metrics
        # reads it off this command rather than from a setting, since a setting
        # can disagree with the command and then the numbers are confident and
        # wrong.
        #
        # If GOPROXY is off, or any module fails to resolve, the outdated count
        # is NOT recorded and the run says so. That is deliberate: with the proxy
        # off the toolchain exits 0, writes nothing to stderr, and reports an
        # update on nothing, so "every dependency is current" and "nothing was
        # ever checked" are the same bytes. The other two measurements are
        # unaffected, which is why they are separate signals.
        name: dependencies
        command: ["go", "list", "-m", "-u", "-json", "all"]
        stdout_format: go-list-modules
        timeout: 3m

  # Ingest only: no command, so repo-metrics parses whatever is already on disk.
  # This is how you consume a profile your CI already produced.
  - name: built-by-ci
    path: /srv/checkouts/built-by-ci
    signals:
      - name: coverage
        artifact: artifacts/coverage.out
        artifact_format: go-coverprofile

        # Ingest mode only, because it is the only freshness signal there is
        # when nobody here ran anything. An artifact older than this is reported
        # as stale instead of being presented as a current number, which is the
        # whole point: a coverage file sitting at the expected path is not
        # evidence that anything ran.
        #
        # There is no way to switch the check off with a zero: 0s is rejected
        # rather than read as the default, since the two used to be
        # indistinguishable and an operator asking for no limit got 24 hours.
        # Omit the key to get the default.
        # Default: 24h
        max_age: 36h

        # No command here, so no stdout_format and no timeout. Coverage only, no
        # test counts, because nothing produced a -json stream for this repo.

  # ${VAR} and $VAR are expanded from the environment in five places and only
  # five: the top-level database, and each repo's path, plus each signal's
  # artifact, command entries, and env VALUES. That is enough to keep the
  # machine-specific parts of a checkout layout out of the file.
  #
  # Nothing else is expanded. A ${VAR} in a name or in an env KEY is kept as
  # literal text, and one in a format, timeout, or max_age makes the config fail
  # to load, since those are parsed and validated exactly as written.
  # - name: from-env
  #   path: ${CHECKOUT_ROOT}/another-repo
  #   signals:
  #     - name: coverage
  #       artifact: coverage.out
  #       artifact_format: go-coverprofile
