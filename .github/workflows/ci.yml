name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # This module is developed inside a directory that carries a sibling go.work
  # which does not list it, so every local toolchain call has to opt out or it
  # fails with "directory prefix . does not contain modules listed in go.work".
  # The Makefile exports the same thing. In CI there is no go.work at all, so
  # this is harmless here; it is set so that CI and a developer laptop run the
  # toolchain under identical settings and neither can pass while the other
  # fails for a workspace reason.
  #
  # Quoted on purpose: bare off is a YAML 1.1 boolean and would reach the
  # toolchain as the string "false", which Go reads as a workspace file path.
  GOWORK: "off"

jobs:
  # One job on purpose. This is a small tool with one supported toolchain, and
  # a matrix here would be four times the minutes to learn nothing.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The go directive in go.mod is the single source of truth for the
          # version, so bumping the module does not also mean editing CI.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race needs cgo, which is why CGO_ENABLED is deliberately left alone.
      # The released binary is built CGO-free elsewhere; the test run is not.
      - name: Test
        run: go test ./... -race

      # The two cross-checks against the real Go toolchain are opt-in: they skip
      # unless handed a genuine coverage profile or -json stream through
      # REPO_METRICS_TEST_PROFILE and REPO_METRICS_TEST_JSON. So CI produces a
      # real pair here and actually runs them.
      #
      # This step used to run them by name with nothing set, on the theory that
      # it kept them from rotting into code that no longer builds. It did not
      # earn its place: the -race run above compiles them already, so all that
      # step could report was two skips and a green check.
      #
      # cmd/repo-metrics is in the selection because it has no test files, which
      # is what makes go emit the "[no test files]" marker the JSON cross-check
      # counts. Without it that assertion compares zero against zero.
      #
      # Honest about the scope: this exercises the wiring and the parser's
      # agreement with go tool cover on a real profile. It is one package's
      # worth of coverage, not a repo-scale -coverpkg=./... profile where the
      # same block appears once per test binary, which is the case the
      # dedup logic exists for. Widening the profile is the obvious next move if
      # this proves cheap.
      - name: Produce real toolchain artifacts
        # Both artifacts go to the runner's temp dir rather than the workspace,
        # so nothing here can be mistaken for a checked-in file or picked up by
        # a later step that globs the tree.
        #
        # The -json stream has to land in a file, so a failure here would show
        # an empty log. Replay the file before failing.
        run: |
          go test ./internal/collect/golang/ ./cmd/repo-metrics/ \
            -coverpkg=./internal/collect/golang/... \
            -coverprofile=${{ runner.temp }}/coverage.out \
            -json > ${{ runner.temp }}/test-stream.json \
            || { cat ${{ runner.temp }}/test-stream.json; exit 1; }

      - name: Cross-check the parsers against the real toolchain
        env:
          REPO_METRICS_TEST_PROFILE: ${{ runner.temp }}/coverage.out
          # go tool cover -func reads the source the profile names, so it has to
          # run where the module resolves.
          REPO_METRICS_TEST_PROFILE_DIR: ${{ github.workspace }}
          REPO_METRICS_TEST_JSON: ${{ runner.temp }}/test-stream.json
        # -count=1 is load-bearing, not a habit. These two tests read their
        # inputs from paths named in the environment, and the test cache was
        # observed serving a PASS from an earlier run against a different
        # profile: it reported the old numbers and never opened the new files.
        # A cross-check that can pass without looking at the artifact is the
        # same do-nothing step this one replaced.
        run: go test -count=1 ./internal/collect/golang/ -run 'TestAgainstGoToolCover|TestTestJSONAgainstRealStream' -v

      - name: Coverage
        # Reported, never enforced. There is deliberately no floor and no
        # ratchet: a percentage gate punishes an honest deletion of covered code
        # and rewards writing low-value tests to clear a bar, which is the exact
        # confusion this tool argues against everywhere else. The number is for
        # a human to look at.
        #
        # -coverpkg=./... is what keeps untested packages in the denominator, so
        # the figure counts code nobody tested rather than quietly excluding it.
        run: |
          go test ./... -coverpkg=./... -coverprofile=${{ runner.temp }}/all.out
          go tool cover -func=${{ runner.temp }}/all.out | tail -1

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, never floating. .golangci.yml is a v2 config, and v1 rejects
          # it with an error that talks about the Go version instead of the
          # config format, which sends people off debugging entirely the wrong
          # thing. This is also the version used locally.
          version: v2.12.2
