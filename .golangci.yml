version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - dupword
    - errorlint
    - misspell
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - usestdlibvars
    - whitespace
  settings:
    misspell:
      locale: US
    nolintlint:
      # A blanket //nolint with no linter named is how suppressions rot. If one
      # is genuinely warranted it should say which check and why.
      require-specific: true
      require-explanation: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Romero-jace/repo-metrics
